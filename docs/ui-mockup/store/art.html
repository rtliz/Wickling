<!doctype html>
<html lang="th"><head><meta charset="utf-8"><title>Wickling: store art</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@600;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0c0911}
svg{display:block}
.title{font:800 92px Prompt,sans-serif;fill:#fff6c0}
.sub{font:600 42px Prompt,sans-serif;fill:#ffb13b}
.tag{font:600 27px Prompt,sans-serif;fill:#f6ecd6}
</style></head><body>
<!-- ?v=icon = 512×512 · ?v=feature = 1024×500
     Android (สร้างด้วย node scripts/android-art.mjs): ?v=fg / ?v=bg = ไอคอน adaptive 108dp · ?v=round = ไอคอนกลม
     ?v=splash&w=..&h=.. = หน้าเปิดเนทีฟ (พื้น #0c0911 + ภูติกลางจอ กว้าง 34% ของด้านสั้น ตรงกับ #splash ใน index.html) -->
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="f" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff5a2b"/><stop offset=".45" stop-color="#ffb13b"/><stop offset="1" stop-color="#fff6c0"/></linearGradient>
<linearGradient id="s0" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#c9b8ff" stop-opacity=".15"/><stop offset=".5" stop-color="#c9b8ff" stop-opacity=".75"/><stop offset="1" stop-color="#fbf9ff"/></linearGradient>
<linearGradient id="s1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#8fe3d0" stop-opacity=".15"/><stop offset=".5" stop-color="#8fe3d0" stop-opacity=".75"/><stop offset="1" stop-color="#fbf9ff"/></linearGradient>
<radialGradient id="bg" cx=".5" cy=".5" r=".72"><stop offset="0" stop-color="#4a2f3f"/><stop offset=".55" stop-color="#211830"/><stop offset="1" stop-color="#0c0911"/></radialGradient>
<radialGradient id="glow" r=".5"><stop offset="0" stop-color="#ffb13b" stop-opacity=".6"/><stop offset=".5" stop-color="#ff8f3b" stop-opacity=".18"/><stop offset="1" stop-color="#ff8f3b" stop-opacity="0"/></radialGradient>
<pattern id="tiles" width="96" height="96" patternUnits="userSpaceOnUse"><rect width="96" height="96" fill="none" stroke="#3d3150" stroke-width="3" opacity=".65"/></pattern>
<g id="face"><ellipse cx="-4.5" cy="2" rx="2" ry="2.6" fill="#1b1430"/><ellipse cx="4.5" cy="2" rx="2" ry="2.6" fill="#1b1430"/>
  <circle cx="-3.8" cy="1" r=".8" fill="#fff"/><circle cx="5.2" cy="1" r=".8" fill="#fff"/>
  <path d="M-2 7 Q0 9 2 7" fill="none" stroke="#1b1430" stroke-width="1.5" stroke-linecap="round"/></g>
<g id="hero"><path d="M0 -24 Q8 -14 13 -2 Q16 14 0 16 Q-16 14 -13 -2 Q-10 -10 -4 -14 Q-3 -8 0 -8 Q-2 -16 0 -24Z" fill="url(#f)" stroke="#1b1430" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M0 -4 Q4 0 4 4 Q0 8 -4 4 Q-4 0 0 -4Z" fill="#fff6c0" opacity=".55"/><use href="#face"/></g>
<g id="ghost0"><path d="M-6 15 Q-14 21 -7 26 Q0 30 -5 31" fill="none" stroke="#c9b8ff" stroke-width="3" stroke-linecap="round" opacity=".55"/>
  <path d="M0 -24 Q8 -14 13 -2 Q16 14 0 16 Q-16 14 -13 -2 Q-10 -10 -4 -14 Q-3 -8 0 -8 Q-2 -16 0 -24Z" fill="url(#s0)" stroke="#1b1430" stroke-width="2.2" stroke-linejoin="round" opacity=".85"/><use href="#face"/></g>
<g id="ghost1"><path d="M-6 15 Q-14 21 -7 26 Q0 30 -5 31" fill="none" stroke="#8fe3d0" stroke-width="3" stroke-linecap="round" opacity=".55"/>
  <path d="M0 -24 Q8 -14 13 -2 Q16 14 0 16 Q-16 14 -13 -2 Q-10 -10 -4 -14 Q-3 -8 0 -8 Q-2 -16 0 -24Z" fill="url(#s1)" stroke="#1b1430" stroke-width="2.2" stroke-linejoin="round" opacity=".85"/><use href="#face"/></g>
</defs></svg>

<svg id="icon" width="512" height="512" viewBox="0 0 512 512" style="display:none">
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#tiles)"/>
  <circle cx="256" cy="262" r="240" fill="url(#glow)"/>
  <use href="#ghost0" transform="translate(96 200) scale(3.1)" opacity=".85"/>
  <use href="#ghost1" transform="translate(416 200) scale(3.1)" opacity=".85"/>
  <use href="#hero" transform="translate(256 290) scale(7.2)"/>
</svg>

<!-- adaptive icon: เนื้อหาอยู่ในวงกลมปลอดภัย 66/108 ตรงกลาง (Android ตัดขอบเป็นรูปทรงต่าง ๆ) -->
<svg id="fg" width="432" height="432" viewBox="0 0 432 432" style="display:none">
  <use href="#ghost0" transform="translate(122 190) scale(2)" opacity=".85"/>
  <use href="#ghost1" transform="translate(310 190) scale(2)" opacity=".85"/>
  <use href="#hero" transform="translate(216 238) scale(4.9)"/>
</svg>
<svg id="bg" width="432" height="432" viewBox="0 0 512 512" style="display:none">
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#tiles)"/>
  <circle cx="256" cy="262" r="240" fill="url(#glow)"/>
</svg>
<svg id="round" width="512" height="512" viewBox="0 0 512 512" style="display:none">
  <clipPath id="circ"><circle cx="256" cy="256" r="256"/></clipPath>
  <g clip-path="url(#circ)"><rect width="512" height="512" fill="url(#bg)"/><rect width="512" height="512" fill="url(#tiles)"/>
  <circle cx="256" cy="262" r="240" fill="url(#glow)"/>
  <use href="#ghost0" transform="translate(120 206) scale(2.8)" opacity=".85"/>
  <use href="#ghost1" transform="translate(392 206) scale(2.8)" opacity=".85"/>
  <use href="#hero" transform="translate(256 290) scale(6.4)"/></g>
</svg>
<svg id="splash" style="display:none"><rect width="100%" height="100%" fill="#0c0911"/><use id="spHero" href="#hero"/></svg>

<svg id="feature" width="1024" height="500" viewBox="0 0 1024 500" style="display:none">
  <rect width="1024" height="500" fill="url(#bg)"/>
  <rect width="1024" height="500" fill="url(#tiles)"/>
  <circle cx="230" cy="280" r="260" fill="url(#glow)"/>
  <use href="#ghost0" transform="translate(70 170) scale(2.5)" opacity=".85"/>
  <use href="#ghost1" transform="translate(380 150) scale(2.5)" opacity=".85"/>
  <use href="#hero" transform="translate(230 300) scale(5.6)"/>
  <text class="title" x="480" y="210">Wickling</text>
  <text class="sub" x="484" y="272">ภูติตะเกียง</text>
  <text class="tag" x="484" y="334">เล่นพลาดไม่แพ้ แค่ได้เงาตัวเองมาช่วย</text>
</svg>
<script>
const q = new URLSearchParams(location.search), v = q.get('v') || 'icon';
const el = document.getElementById(['feature', 'fg', 'bg', 'round', 'splash'].includes(v) ? v : 'icon');
el.style.display = 'block';
if (v === 'fg' || v === 'round') document.documentElement.style.background = document.body.style.background = 'transparent';
const size = Number(q.get('s'));
if (size && v !== 'splash') { el.setAttribute('width', size); el.setAttribute('height', size); }
if (v === 'splash') {
  // ภูติกว้าง 34% ของด้านสั้น (viewBox ของตัวภูติกว้าง 32 หน่วย, กล่อง y -26..18 → กลางกล่อง y = -4) วางกลางจอพอดี
  const w = Number(q.get('w')), h = Number(q.get('h')), k = 0.34 * Math.min(w, h) / 32;
  el.setAttribute('width', w); el.setAttribute('height', h); el.setAttribute('viewBox', `0 0 ${w} ${h}`);
  document.getElementById('spHero').setAttribute('transform', `translate(${w / 2} ${h / 2 + 4 * k}) scale(${k})`);
}
</script>
</body></html>
