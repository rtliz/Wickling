<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%}</style>
<title>ภูติตะเกียง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600&display=swap">
<style>
/* ภูติตะเกียง: วิหารมืด แสงไฟอุ่น เงาเป็นควันเรืองแสง · แผงมืดขอบทองบาง + ขีดมุม (มาตรฐานสตูดิโอ) */
:root{
  --bg:#0c0911; --bg2:#211830; --panel:#1f172b; --panel2:#140f1c; --gold:#e6bd5c; --gold-soft:rgba(230,189,92,.5);
  --fg:#f6ecd6; --muted:#b9aed3; --flame:#ffb13b; --red:#e85a3a; --red-d:#a8301f; --ink:#1b1430;
  --display:"Prompt","Noto Sans Thai",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:radial-gradient(90% 60% at 50% 40%,var(--bg2) 0%,var(--bg) 75%) fixed,var(--bg);color:var(--fg);font-family:var(--display);
  display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;box-sizing:border-box;gap:10px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:520px;width:100%;margin:0 auto;position:relative;
  background:linear-gradient(var(--panel),var(--panel2));border:1.5px solid var(--gold-soft);border-radius:10px;padding:8px 14px}
header::before,header::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--gold)}
header::before{top:-3px;left:-3px;border-right:0;border-bottom:0}
header::after{bottom:-3px;right:-3px;border-left:0;border-top:0}
h1{font-weight:600;font-size:1.15rem;margin:0;line-height:1.25}
.sub{color:var(--muted);font-size:.72rem;letter-spacing:.03em}
.ghosts{font-size:.8rem;text-align:right;white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.ghosts .dots{display:flex;gap:5px;justify-content:flex-end;margin-top:3px}
.ghosts .dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--gold-soft);box-sizing:border-box}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;max-width:520px;width:100%;margin:0 auto}
canvas{display:block;touch-action:none;border-radius:8px}
#banner{min-height:2.7em;text-align:center;font-size:.86rem;color:var(--muted);max-width:520px;margin:0 auto;line-height:1.4}
#banner b{color:var(--flame);font-weight:600}
#banner small{opacity:.8}
.timer{display:flex;align-items:center;max-width:520px;width:100%;margin:0 auto;height:20px}
.timer .wax{height:10px;width:100%;background:linear-gradient(#fff6e2,#e9d2b0);border:1.5px solid var(--ink);border-radius:3px;flex:0 0 auto}
.timer .fl{width:12px;height:18px;margin-left:1px;margin-top:-10px;flex:0 0 auto;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(circle at 50% 70%,#fff8c4 0 25%,var(--flame) 55%,#ff6a2b 90%);box-shadow:0 0 12px var(--flame);animation:flick 1.1s ease-in-out infinite}
.timer .rest{flex:1;height:2px;margin-left:4px;background:rgba(230,189,92,.2)}
.controls{display:flex;gap:8px;max-width:520px;width:100%;margin:0 auto}
.skills{display:flex;gap:8px;max-width:520px;width:100%;margin:0 auto}
.skills button{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 6px;border-color:var(--gold)}
.skills button svg{width:22px;height:22px;flex:0 0 auto}
.skills button span{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.skills button small{font-size:.62rem;color:var(--muted)}
.skills button.used{opacity:.35}
button{font-family:var(--display);font-size:.88rem;color:var(--fg);background:linear-gradient(#251c33,#18111f);border:1.5px solid var(--gold-soft);
  border-radius:12px;padding:11px 6px;flex:1;cursor:pointer;box-shadow:0 3px 0 #000}
button:disabled{opacity:.35}
button:focus-visible{outline:2px solid var(--flame);outline-offset:2px}
button.primary{background:linear-gradient(var(--red),var(--red-d));border-color:#ffcf8a;font-weight:600}
.levels{display:flex;gap:6px;max-width:520px;width:100%;margin:0 auto;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.levels button{flex:0 0 auto}
.levels button.tree{width:auto;padding:6px 10px;border-color:var(--gold);color:var(--gold)}
.ghosts .dot.tap{cursor:pointer;outline:1px dashed rgba(230,189,92,.5);outline-offset:2px}
.skills button.passive{opacity:.7;cursor:default}
#gmenu{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:76px;z-index:20;display:flex;flex-direction:column;gap:6px;padding:12px;min-width:210px;
  background:linear-gradient(var(--panel),var(--panel2));border:1.5px solid var(--gold);border-radius:10px;box-shadow:0 6px 0 #000}
#gmenu b{font-size:.85rem}
#gmenu small{color:var(--muted);font-size:.72rem;line-height:1.35}
#gmenu button{flex:none;padding:8px}
#treeOv .phone{width:360px;max-width:100%;height:960px;border-radius:34px;border:6px solid var(--ink);overflow:hidden;position:relative;
  background:radial-gradient(90% 60% at 50% 45%,var(--bg2) 0%,var(--bg) 75%);color:var(--fg);font-family:Prompt,sans-serif;
  display:flex;flex-direction:column;padding:16px 14px 14px;gap:10px;box-shadow:0 10px 0 rgba(27,20,48,.18)}
#treeOv .panel{position:relative;background:linear-gradient(var(--panel),var(--panel2));border:1.5px solid var(--gold-soft);border-radius:10px}
#treeOv .panel::before,#treeOv .panel::after{content:"";position:absolute;width:13px;height:13px;border:2px solid var(--gold)}
#treeOv .panel::before{top:-3px;left:-3px;border-right:0;border-bottom:0}
#treeOv .panel::after{bottom:-3px;right:-3px;border-left:0;border-top:0}
#treeOv .top{display:flex;justify-content:space-between;align-items:center;padding:8px 12px}
#treeOv .top b{font-size:1.1rem}
#treeOv .top small{display:block;color:var(--muted);font-size:.7rem}
#treeOv .stars{font-size:1.05rem;color:var(--gold);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
#treeOv .stars svg{width:20px;height:20px}
#treeOv .close{position:absolute;right:-6px;top:-10px;width:28px;height:28px;border-radius:50%;background:var(--panel);border:1.5px solid var(--gold);color:var(--gold);
  display:grid;place-items:center;font-size:.85rem}
#treeOv .tree{position:relative;flex:1;min-height:0}
#treeOv .tree svg.links{position:absolute;inset:0;width:100%;height:100%}
#treeOv .node{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;border:2.5px solid #4a3c5c;background:#17111f;
  display:grid;place-items:center;cursor:pointer;transition:transform .15s}
#treeOv .node svg{width:30px;height:30px}
#treeOv .node .cost{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);font-size:.66rem;background:#17111f;border:1px solid #4a3c5c;
  border-radius:8px;padding:0 6px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
#treeOv .node.locked{opacity:.45}
#treeOv .node.avail{border-color:var(--gold);animation:ready 1.6s ease-in-out infinite}
#treeOv .node.avail .cost{color:var(--gold);border-color:var(--gold-soft)}
#treeOv .node.owned{border-color:var(--c);background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--c) 45%,#17111f),#17111f 75%);box-shadow:0 0 16px color-mix(in srgb,var(--c) 60%,transparent)}
#treeOv .node.owned .cost{display:none}
#treeOv .node.sel{transform:scale(1.12);outline:2px solid #fff;outline-offset:3px}
#treeOv .node.cap{width:70px;height:70px;margin:-35px 0 0 -35px}
#treeOv .node.cap svg{width:38px;height:38px}
#treeOv .node .eq{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--red);border:1.5px solid #ffcf8a;
  font-size:.62rem;display:grid;place-items:center;font-weight:700}
#treeOv .blabel{position:absolute;transform:translateX(-50%);font-size:.7rem;letter-spacing:.04em;white-space:nowrap}
@keyframes ready{50%{box-shadow:0 0 14px rgba(230,189,92,.55)}}
#treeOv .detail{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
#treeOv .detail .hd{display:flex;gap:10px;align-items:center}
#treeOv .detail .ic{width:44px;height:44px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;flex:0 0 auto;background:#17111f}
#treeOv .detail .ic svg{width:26px;height:26px}
#treeOv .detail h2{font-size:1.05rem;margin:0}
#treeOv .detail .br{font-size:.7rem;color:var(--c);letter-spacing:.04em}
#treeOv .detail p{margin:0;font-size:.84rem;color:var(--muted);line-height:1.45}
#treeOv .detail .pv{width:100%;height:auto;aspect-ratio:616/300;border-radius:8px;border:1px solid #3d3150;background:#120d18;display:block}
#treeOv .detail .room{font-size:.74rem;color:var(--muted);line-height:1.4;border-left:2px solid var(--c);padding-left:8px}
#treeOv .detail .room b{color:var(--fg);font-weight:600}
#treeOv .detail .use{font-size:.75rem;color:var(--fg);opacity:.8}
#treeOv .detail .row{display:flex;gap:8px;margin-top:auto}
#treeOv .btn{flex:1;text-align:center;padding:10px 6px;border-radius:12px;font-size:.88rem;border:1.5px solid var(--gold-soft);
  background:linear-gradient(#251c33,#18111f);color:var(--fg);box-shadow:0 3px 0 #000;cursor:pointer;font-family:inherit}
#treeOv .btn.main{background:linear-gradient(var(--red),var(--red-d));border-color:#ffcf8a;font-weight:600}
#treeOv .btn:disabled{opacity:.4;cursor:default}
#treeOv .slots{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:.78rem;color:var(--muted)}
#treeOv .slot{width:40px;height:40px;border-radius:10px;border:1.5px dashed var(--gold-soft);display:grid;place-items:center}
#treeOv .slot svg{width:24px;height:24px}
#treeOv .slot.full{border-style:solid;border-color:var(--gold);background:#17111f}
#treeOv .toast{position:absolute;left:50%;top:84px;transform:translateX(-50%);background:var(--panel);border:1.5px solid var(--gold);border-radius:10px;
  padding:6px 12px;font-size:.82rem;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:3}
#treeOv .toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#treeOv .node.avail{animation:none}#treeOv .node{transition:none}}
#treeOv{position:fixed;inset:0;z-index:50;background:rgba(8,6,12,.94);display:flex;justify-content:center;
  --page:#e7e3ee;--b-time:#ffb13b;--b-smoke:#c9b8ff;--b-light:#8fe3d0;--red:#e85a3a;--red-d:#a8301f;--ink:#1b1430}
#treeOv .phone{height:100%;width:min(420px,100%);border:0;border-radius:0;box-shadow:none;overflow-y:auto;padding-top:max(16px,env(safe-area-inset-top,0px))}
#treeOv .tree{min-height:330px}
#treeOv .bonus{font:inherit;font-size:.65rem;color:var(--muted);background:none;border:1px dashed var(--gold-soft);border-radius:8px;padding:3px 6px;cursor:pointer;flex:0 0 auto}
#treeOv .close{cursor:pointer}
.levels button{flex:0 0 auto;width:46px;padding:6px 0;font-size:.8rem;line-height:1.1;border-radius:10px}
.levels button.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 3px 0 #000}
.levels small{display:block;color:var(--gold);font-size:.62rem;letter-spacing:.05em}
#win{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,6,12,.72);border-radius:8px;padding:16px}
#win .card{position:relative;background:linear-gradient(var(--panel),var(--panel2));border:1.5px solid var(--gold-soft);border-radius:12px;
  padding:20px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;width:min(320px,100%);box-shadow:0 6px 0 #000}
#win .card::before,#win .card::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--gold)}
#win .card::before{top:-3px;left:-3px;border-right:0;border-bottom:0}
#win .card::after{bottom:-3px;right:-3px;border-left:0;border-top:0}
#win h2{font-size:1.5rem;margin:0;color:var(--flame)}
#win .stars{font-size:2.1rem;letter-spacing:.15em;color:var(--gold);text-shadow:0 0 12px rgba(255,177,59,.6)}
#win .stars s{color:#3d3150;text-decoration:none;text-shadow:none}
#win p{margin:0;color:var(--muted);max-width:30ch;font-size:.88rem}
#win .row{display:flex;gap:8px;width:100%}
@keyframes flick{0%,100%{transform:scale(1,1)}40%{transform:scale(.9,1.08)}70%{transform:scale(1.05,.95)}}
@media (prefers-reduced-motion:reduce){.timer .fl{animation:none}}
</style>
</head>
<body>

<header>
  <div>
    <div class="sub" id="lvlNo">ห้อง 1/5</div>
    <h1 id="lvlName">สวิตช์แรก</h1>
  </div>
  <div class="ghosts">
    <div id="ghostTxt">เงา 0/4</div>
    <div class="dots" id="dots"></div>
  </div>
</header>

<div id="stage">
  <canvas id="cv" aria-label="กระดานเกม แตะช่องเพื่อเดิน"></canvas>
  <div id="win" hidden><div class="card">
    <h2 id="winTitle">ผ่านแล้ว!</h2>
    <div class="stars" id="winStars"></div>
    <p id="winMsg"></p>
    <div class="row">
      <button id="btnRetry">เล่นห้องนี้อีก</button>
      <button id="btnNext" class="primary">ห้องต่อไป</button>
    </div>
  </div></div>
</div>

<div id="banner"></div>
<div class="timer" id="timerBar" aria-label="เวลาที่เหลือ"><span class="wax" id="bar"></span><span class="fl"></span><span class="rest"></span></div>
<div class="skills" id="skillBar"></div>
<div class="controls">
  <button id="btnEnd" disabled>ใช้เงาเลย ⟲</button>
  <button id="btnUndo" disabled>ลบเงาล่าสุด</button>
  <button id="btnReset">เริ่มห้องใหม่</button>
</div>
<div class="levels" id="levels"></div>
<div id="gmenu" hidden></div>
<div id="treeOv" hidden>
<div class="phone" id="phone">
    <div class="panel top">
      <div><small>ภูติตะเกียง · ใช้ดาวจากด่าน</small><b>ต้นไม้เปลวไฟ</b></div>
      <div class="stars"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z" fill="#e6bd5c" stroke="#1b1430" stroke-width="1.6" stroke-linejoin="round"/></svg><span id="stars">0</span></div>
      <button class="bonus" id="treeBonus">+20 ★ ทดสอบ</button>
      <div class="close" id="treeClose" role="button" aria-label="ปิด">✕</div>
    </div>
    <div class="tree" id="tree"><svg class="links" id="links"></svg></div>
    <div class="panel slots"><span>ติดตัวเข้าด่าน</span><div class="slot" id="slot0"></div><div class="slot" id="slot1"></div><span id="slotHint">เลือกได้ 2 สกิล</span></div>
    <div class="panel detail" id="detail"></div>
    <div class="toast" id="toast"></div>
  </div>
</div>
<script>
(() => {

const INK = "#1b1430";
const ICON = {
  flame:`<path d="M12 2.5 Q16 7 18 11 Q20 18 12 21 Q4 18 6 11 Q7.5 8 10 6.5 Q10 10 12 10 Q11 6 12 2.5Z" fill="#ffb13b" stroke="${INK}" stroke-width="1.5" stroke-linejoin="round"/><circle cx="10" cy="15" r="1.1" fill="${INK}"/><circle cx="14" cy="15" r="1.1" fill="${INK}"/>`,
  eye:`<path d="M2.5 12 Q12 3 21.5 12 Q12 21 2.5 12Z" fill="#2a2134" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 9.5 V12 L13.8 13.2" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>`,
  pause:`<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="8.3" y="7.5" width="2.6" height="9" rx="1" fill="currentColor"/><rect x="13.1" y="7.5" width="2.6" height="9" rx="1" fill="currentColor"/>`,
  rewind:`<path d="M19 12 A7 7 0 1 1 12 5 H15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M14 2 L17.5 5 L14 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="matrix(-1 0 0 1 29 0)"/>`,
  recall:`<path d="M6 18 Q3 12 8 8 Q13 4 17 8 Q20 12 16 15 Q13 17 11 14 Q10 11 13 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M15 19 H21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>`,
  hourglass:`<path d="M7 3 H17 M7 21 H17 M8 3 Q8 9 12 12 Q16 9 16 3 M8 21 Q8 15 12 12 Q16 15 16 21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M10 19 Q12 16 14 19Z" fill="currentColor"/>`,
  mirror:`<path d="M12 3 V21" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2 2"/><path d="M10 7 L4 12 L10 17Z" fill="currentColor" opacity=".9"/><path d="M14 7 L20 12 L14 17Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>`,
  radiate:`<circle cx="12" cy="12" r="3.5" fill="currentColor"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.5 V5.5 M12 18.5 V21.5 M2.5 12 H5.5 M18.5 12 H21.5 M5.3 5.3 L7.4 7.4 M16.6 16.6 L18.7 18.7 M5.3 18.7 L7.4 16.6 M16.6 7.4 L18.7 5.3"/></g>`,
  dash:`<path d="M4 6 L10 12 L4 18 M11 6 L17 12 L11 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="12" r="1.8" fill="currentColor"/>`,
  lantern:`<path d="M9 4 H15 M12 2 V4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="7" y="5" width="10" height="13" rx="3" fill="#2a2134" stroke="currentColor" stroke-width="1.8"/><path d="M12 8.5 Q14 11 13 13.5 Q12 15 11 13.5 Q10 11 12 8.5Z" fill="currentColor"/><path d="M8 20.5 H16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>`,
  split:`<path d="M8 4 Q11 8 11.5 11 Q12 16 7.5 17 Q3 16 4 11 Q5 8 8 4Z" fill="#ffb13b" stroke="${INK}" stroke-width="1.4"/><path d="M16 6 Q19 10 19.5 13 Q20 18 15.5 19 Q11 18 12 13 Q13 10 16 6Z" fill="#c9b8ff" stroke="${INK}" stroke-width="1.4"/>`,
};
const BR = { root:{ n:"ราก", c:"#ffb13b" }, time:{ n:"เปลวแห่งเวลา", c:"#ffb13b" }, smoke:{ n:"ควันวิญญาณ", c:"#c9b8ff" }, light:{ n:"แสงนำทาง", c:"#8fe3d0" }, cap:{ n:"ยอดต้นไม้", c:"#ffd27a" } };
// x,y เป็น % ของพื้นที่ต้นไม้ · kind: active = กดใช้ในด่าน 1 ครั้งต่อรอบ, passive = ทำงานเอง
const NODES = [

    lanes.forEach(r => { if (ri(0, 1)) { g[r][0] = ">"; blockers.push([r, 1]); } else { g[r][6] = "<"; blockers.push([r, 5]); } });
    const start = [7, ri(1, 5)], exit = [1, ri(1, 5)];
    g[start[0]][start[1]] = "S"; g[exit[0]][exit[1]] = "E";
    const low = doorRows.length ? Math.max(...doorRows) : 8, sw = [];
    const swCand = [];
    for (let r = Math.min(low + 1, 7); r <= 7; r++) for (let c = 1; c <= 5; c++)
      if (r > (doorRows.length ? low : 0) && !lanes.includes(r) && g[r][c] === "." ) swCand.push([r, c]);
    if (swCand.length < D) continue;
    for (let k = 0; k < D; k++) { const p = pick(swCand); g[p[0]][p[1]] = "ab"[k]; sw.push(p); }
    // เสากลางห้อง: เพิ่มตามชั้น แต่ห้ามขวางเลน เลเซอร์ ช่องประตู หรือของสำคัญ
    const near = (r, c) => gaps.some(([gr, gc]) => gc === c && Math.abs(gr - r) === 1) || blockers.some(([br, bc]) => br === r && bc === c);
    const pillCand = [];
    for (let r = 1; r <= 7; r++) for (let c = 1; c <= 5; c++) if (g[r][c] === "." && !lanes.includes(r) && !near(r, c)) pillCand.push([r, c]);
    const P = Math.min(4, Math.floor((floor - 1) / 2));
    for (let k = 0; k < P && pillCand.length; k++) { const p = pick(pillCand); g[p[0]][p[1]] = "#"; }
    // ตรวจว่าเดินถึงทุกจุดสำคัญภายในเวลา (เปิดประตูทุกบาน)
    const dist = new Map([[start.join(), 0]]), q = [start];
    while (q.length) { const [r, c] = q.shift(), d = dist.get(r + "," + c);
      for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) { const nr = r + dr, nc = c + dc, ch = g[nr][nc];
        if (ch === "#" || ch in DIRS || dist.has(nr + "," + nc)) continue; dist.set(nr + "," + nc, d + 1); q.push([nr, nc]); } }
    const targets = [exit, ...sw, ...blockers];
    if (!targets.every(t => dist.has(t.join()) && dist.get(t.join()) <= 26)) continue;
    const parts = [];
    if (D) parts.push(`ประตู ${D} บาน`);
    if (Lz) parts.push(`เลเซอร์ ${Lz} เส้น`);
    return { name:`หอคอย ชั้น ${floor}`, par: D + Lz, tower:true,
      hint:`ห้องสุ่มชั้น ${floor} · ${parts.join(" · ")} · ทุกห้องผ่านได้แน่นอน`, map: g.map(r => r.join("")) };
  }
  return { ...LEVELS[0], name:`หอคอย ชั้น ${floor}`, tower:true };
}
// สีของภาพในกระดาน (ธีมภูติตะเกียง) · เก็บที่เดียว
const INK = "#1b1430";
const COL = { bg:"#0c0911", wall:"#120d18", gold:"#e6bd5c", stone:["#2d2438","#2a2134","#30263c"], stoneLine:"#3d3150", crack:"#1e1728",
  player:"#ffb13b", laser:"#ff3a4a", exit:"#ffd27a", a:"#e6bd5c", b:"#ff8f6b",
  ghost:["#c9b8ff","#8fe3d0","#ffb3c7","#9fd4ff"] };
const NOTES = [523.25, 659.25, 783.99, 987.77];  // เงาแต่ละตัวมีโน้ตของตัวเอง กดพร้อมกันเป็นคอร์ด

const $ = id => document.getElementById(id);

let best = {};
try { best = JSON.parse(localStorage.getItem("echo-proto-best") || "{}"); } catch (e) {}

function loadLevel(i) {
  const L = i < 0 ? genTower(tower.floor) : LEVELS[i], rows = L.map.length, cols = L.map[0].length;
  const grid = [], emitters = [];
  let start, exit;
  for (let r = 0; r < rows; r++) {
    grid.push([]);
    for (let c = 0; c < cols; c++) {
      const ch = L.map[r][c]; let cell;
      if (ch === "#") cell = { t:"wall" };
      else if (DIRS[ch]) { cell = { t:"emit", d:DIRS[ch], pulse:PULSE[ch] }; emitters.push({ r, c, d:DIRS[ch], pulse:PULSE[ch] }); }
      else if (ch === "S") { cell = { t:"floor" }; start = [r, c]; }
      else if (ch === "E") { cell = { t:"exit" }; exit = [r, c]; }
      else if (/[a-z]/.test(ch)) cell = { t:"switch", k:ch };
      else if (/[A-Z]/.test(ch)) cell = { t:"door", k:ch.toLowerCase() };
      else cell = { t:"floor" };
      grid[r].push(cell);
    }

  G = { i, L, rows, cols, grid, emitters, start, exit };
  S = { ghosts: [] };
  $("win").hidden = true;
  startRound();
  renderLevelChips(); resize();
}

  const skLine = sk ? `<br><small>สกิลแนะนำ: ${sk.name} · ${has(sk.id) ? "ติดตัวอยู่" : prof().owned.includes(sk.id) ? "ปลดล็อกแล้ว ไปติดตัวที่ต้นไม้สกิล" : "ยังไม่มี ผ่านด้วยเงาได้ (ดาวน้อยลง)"}</small>` : "";
  banner(S.ghosts.length === 0 ? G.L.hint + skLine
    : `เงา #${S.ghosts.length} พร้อมแล้ว · แตะเพื่อเริ่ม<b>รอบที่ ${S.ghosts.length + 1}</b>`
      + (S.ghosts.length === 1 ? `<br><small>วงประ = ที่ที่เงาจะอยู่ตอนคุณเดินไปถึง</small>` : ""));

// ตำแหน่งเงาทุกตัว ณ เวลาเงา gt (รวมการหน่วงเวลาและเงากระจก)
function ghostList(gt) {
  const out = [];
  S.ghosts.forEach((g, i) => {
    const p = g.rec[Math.max(0, Math.min(gt - (g.delay || 0), g.rec.length - 1))];
    out.push({ p, ci:i });
    if (g.twin) out.push({ p:[p[0], G.cols - 1 - p[1]], ci:i, twin:true });
  });
  return out;
}
const key = p => p[0] + "," + p[1];
const cellOf = p => G.grid[p[0]][p[1]];

// สวิตช์ → ประตู → เลเซอร์ คำนวณจากตำแหน่งทุกตัวในจังหวะนี้
function evaluate(withSound) {
  const gl = ghostList(S.gt), gp = gl.map(x => x.p), all = gp.concat(S.clone ? [S.p, S.clone.p] : [S.p]);
  const lan = [];
  if (S.lantern && S.t >= S.lantern.t0 && S.t < S.lantern.t0 + LANTERN) lan.push(S.lantern.p);
  S.ghosts.forEach(g => { const lt = S.gt - (g.delay || 0); if (g.lantern && lt >= g.lantern.t0 && lt < g.lantern.t0 + LANTERN) lan.push(g.lantern.p); });
  S.lanterns = lan;
  const pressed = {}, open = {};
  all.forEach((p, idx) => { const c = cellOf(p); if (c.t === "switch" && !(c.k in pressed)) pressed[c.k] = idx < gp.length ? gl[idx].ci : "p"; });
  lan.forEach(p => { const c = cellOf(p); if (c.t === "switch" && !(c.k in pressed)) pressed[c.k] = "p"; });
  if (withSound) for (const k in pressed) if (!(k in S.pressed)) note(pressed[k] === "p" ? 392 : NOTES[pressed[k] % 4], .18);
  for (const k of ["a","b"]) open[k] = k in pressed;
  all.forEach(p => { const c = cellOf(p); if (c.t === "door") open[c.k] = true; });  // ประตูปิดทับคนไม่ได้
  const ghostSet = new Set(gp.map(key));
  const beam = new Set(), beamSegs = [];
  for (const e of G.emitters) {
    if (e.pulse !== undefined && pulseOff(S.gt, e.pulse)) continue;
    let r = e.r + e.d[0], c = e.c + e.d[1], end = null;
    while (r >= 0 && c >= 0 && r < G.rows && c < G.cols) {
      const cell = G.grid[r][c];
      if (cell.t === "wall" || cell.t === "emit" || (cell.t === "door" && !open[cell.k])) break;
      if (ghostSet.has(r + "," + c)) { end = [r, c]; break; }
      beam.add(r + "," + c);
      end = [r, c];
      if ((r === S.p[0] && c === S.p[1]) || (S.clone && r === S.clone.p[0] && c === S.clone.p[1])) break;
      r += e.d[0]; c += e.d[1];
    }
    if (end) beamSegs.push({ from:[e.r, e.c], to:end, blocked: ghostSet.has(key(end)) });
  }
  S.pressed = pressed; S.open = open; S.beam = beam; S.beamSegs = beamSegs;
}

function passable(p) {
  const c = cellOf(p);
  if (c.t === "wall" || c.t === "emit") return false;
  if (c.t === "door") return !!S.open[c.k];
  return true;
}

function findPath(from, to) {
  const ok = p => { const c = cellOf(p); return c.t !== "wall" && c.t !== "emit"; };
  if (!ok(to)) return null;
  const prev = new Map([[key(from), null]]), q = [from];
  while (q.length) {
    const cur = q.shift();
    if (cur[0] === to[0] && cur[1] === to[1]) break;
    for (const d of [[-1,0],[1,0],[0,-1],[0,1]]) {
      const n = [cur[0] + d[0], cur[1] + d[1]];
      if (n[0] < 0 || n[1] < 0 || n[0] >= G.rows || n[1] >= G.cols || !ok(n) || prev.has(key(n))) continue;
      prev.set(key(n), cur); q.push(n);
    }
  }
  if (!prev.has(key(to))) return null;
  const path = []; let k = to;
  while (k && key(k) !== key(from)) { path.unshift(k); k = prev.get(key(k)); }
  return path;
}

function tick() {
  S.t++;
  S.gtPrev = S.gt;
  if (S.freeze > 0) S.freeze--; else S.gt++;
  S.pPrev = [...S.p];
  const steps = S.dashArmed && S.path.length ? 2 : 1;
  let moved = 0;
  for (let k = 0; k < steps; k++) if (S.path.length && passable(S.path[0])) { S.p = S.path.shift(); moved++; }
  if (steps === 2) { S.dashArmed = false; if (moved) S.dashFx = { from:S.pPrev, at:performance.now() }; }
  if (S.clone) {
    S.clone.pPrev = [...S.clone.p];
    if (S.t >= S.clone.until) { S.clone = null; S.ctrl = "main"; banner("ดวงที่สองดับแล้ว"); updateHud(); }
    else if (S.clone.path.length && passable(S.clone.path[0])) S.clone.p = S.clone.path.shift();
  }
  if (!S.path.length && !S.idleAt) S.idleAt = performance.now();
  evaluate(true);
  S.rec.push([...S.p]);
  if (S.clone && S.beam.has(key(S.clone.p))) { S.clone = null; S.ctrl = "main"; buzz(); banner("ดวงที่สองโดนลำแสงดับไป"); updateHud(); }
  if (S.beam.has(key(S.p))) return zap();
  if (key(S.p) === key(G.exit) || (S.clone && key(S.clone.p) === key(G.exit))) return win();
  if (S.t >= TICKS) endRound("หมดเวลา");
}

function zap() {
  S.phase = "zap"; S.flash = { color:COL.laser, at:performance.now() };
  buzz(); banner("โดนเลเซอร์! แต่ไม่เป็นไร รอบนี้ยังกลายเป็นเงาได้");

function endRound(why) {
  if (S.ghosts.length >= MAX_GHOSTS) {
    S.ghosts = []; startRound();
    banner(`${why} · เงาครบ ${MAX_GHOSTS} ตัวแล้ว เริ่มห้องใหม่ทั้งหมด ลองวางแผนอีกแบบ`);
    return;
  }
  S.ghosts.push({ rec: S.rec, lantern: S.lantern ? { p:S.lantern.p, t0:S.lantern.t0 } : null, delay:0, twin:false });   // โคมในรอบนี้เล่นซ้ำพร้อมเงาด้วย
  note(330, .25);

function win() {
  S.phase = "win"; S.flash = { color:COL.exit, at:performance.now() };
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => note(f, .25), i * 110));
  const n = S.ghosts.length, par = G.L.par;
  const stars = n <= par ? 3 : n === par + 1 ? 2 : 1;
  if (G.i >= 0) {

    try { localStorage.setItem("echo-proto-best", JSON.stringify(best)); } catch (e) {}

  $("btnNext").textContent = G.i < 0 ? `ขึ้นชั้น ${tower.floor + 1}` : G.i < LEVELS.length - 1 ? "ห้องต่อไป" : "ไปหอคอย ∞";

    for (let j = 1; j <= 3; j++) sprite(SPR.player, lerp(fx, px, j / 4), lerp(fy, py, j / 4), 1, 1, .35 * (1 - k));
  }
  sprite(SPR.player, px, py - TS * .04, 1 - fl, 1 + fl);
  // แยกเปลว: ดวงที่สอง + วงบอกดวงที่กำลังบังคับ
  if (S.clone) {
    const [cx0, cy0] = center(S.clone.pPrev), [cx1, cy1] = center(S.clone.p), cx = lerp(cx0, cx1, a), cy = lerp(cy0, cy1, a);
    glow(cx, cy, TS * .8, "rgba(201,184,255,.85)", .5);
    sprite(SPR.player, cx, cy - TS * .04, 1 + fl, 1 - fl, .85);
    if (S.clone.path.length) { ctx.strokeStyle = "#c9b8ff"; ctx.globalAlpha = .7; ctx.lineWidth = 2; ctx.setLineDash([4, 6]);
      ctx.beginPath(); ctx.moveTo(...center(S.clone.p)); S.clone.path.forEach(p => ctx.lineTo(...center(p))); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1; }
    const [sx, sy] = S.ctrl === "clone" ? [cx, cy] : [px, py];
    ctx.strokeStyle = "#fff6c0"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sx, sy + TS * .3, TS * .22, 0, Math.PI); ctx.stroke();
  }

  // โคม: ตัวโคม + วงนับถอยหลัง
  const lanList = [];
  if (S.lantern && S.t < S.lantern.t0 + LANTERN) lanList.push([S.lantern.p, 1 - (S.t + a - S.lantern.t0) / LANTERN]);
  S.ghosts.forEach(g => { const lt = S.gt - (g.delay || 0); if (g.lantern && lt >= g.lantern.t0 && lt < g.lantern.t0 + LANTERN) lanList.push([g.lantern.p, 1 - (lt - g.lantern.t0) / LANTERN]); });
  for (const [p, left] of lanList) {
    const [lx, ly] = center(p), w = TS * .28, h = TS * .34;
    glow(lx, ly, TS * .7, "rgba(143,227,208,.8)", .5);
    ctx.fillStyle = "#2a2134"; ctx.strokeStyle = "#8fe3d0"; ctx.lineWidth = 2;
    ctx.fillRect(lx - w / 2, ly - h * .9, w, h); ctx.strokeRect(lx - w / 2, ly - h * .9, w, h);
    ctx.fillStyle = "#ffd27a"; ctx.beginPath(); ctx.arc(lx, ly - h * .42, TS * .06, 0, 7); ctx.fill();
    ctx.strokeStyle = "#8fe3d0"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(lx, ly, TS * .44, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(0, left)); ctx.stroke();
  }
  // หยุดเปลว: โทนฟ้า
  if (S.freeze > 0 && S.phase === "run") {
    ctx.globalAlpha = .16; ctx.fillStyle = "#5fa8ff"; ctx.fillRect(0, 0, Wd, Hd); ctx.globalAlpha = 1;
    label("❚❚ หยุดเปลว", Wd - TS * 1.1, TS * .35, "#cfe4ff", TS * .24);
  }
  if (S.flash) {
    const k = 1 - (now - S.flash.at) / 600;
    if (k > 0) { ctx.globalAlpha = k * .35; ctx.fillStyle = S.flash.color; ctx.fillRect(0, 0, Wd, Hd); ctx.globalAlpha = 1; }
  }
  const left = S.phase === "run" ? 1 - Math.min(1, (S.t + a) / TICKS) : S.phase === "ready" ? 1 : 1 - S.t / TICKS;
  const pct = Math.round(Math.max(0, Math.min(1, left)) * 1000) / 10;
  if (pct !== S.barPct) { S.barPct = pct; $("bar").style.width = `calc(${pct}% - 20px)`; }
}

renderSkillBar();
loadLevel(0);
requestAnimationFrame(frame);
})();
</script>
</body>
